name: Configure Cloudflare DNS

on:
  workflow_dispatch:

jobs:
  set-apex-cname:
    name: Set apex CNAME
    runs-on: ubuntu-latest
    steps:
      - name: Upsert Fancy Wave apex CNAME
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 5a3d8d95010fd8c354f05ae0af9e1c0d
          RECORD_NAME: fancywavehairsalon.com
          RECORD_CONTENT: fancy-wave-hair-salon.pages.dev
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const recordName = process.env.RECORD_NAME;
          const recordContent = process.env.RECORD_CONTENT;

          if (!token) {
            throw new Error("CLOUDFLARE_API_TOKEN is not set.");
          }

          const apiBase = `https://api.cloudflare.com/client/v4/zones/${zoneId}/dns_records`;
          const headers = {
            authorization: `Bearer ${token}`,
            "content-type": "application/json",
          };

          async function cloudflare(path, options = {}) {
            const response = await fetch(`${apiBase}${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            });
            const body = await response.json();
            if (!response.ok || body.success === false) {
              const errors = (body.errors || []).map((error) => error.message).join("; ");
              throw new Error(errors || `Cloudflare API returned ${response.status}`);
            }
            return body.result;
          }

          const existing = await cloudflare(`?name=${encodeURIComponent(recordName)}`);
          const conflicting = existing.filter((record) => record.type !== "CNAME");
          if (conflicting.length > 0) {
            const summary = conflicting
              .map((record) => `${record.type} ${record.name} -> ${record.content}`)
              .join(", ");
            throw new Error(`Refusing to replace non-CNAME apex record(s): ${summary}`);
          }

          const payload = {
            type: "CNAME",
            name: recordName,
            content: recordContent,
            ttl: 1,
            proxied: true,
          };

          if (existing.length > 0) {
            await cloudflare(`/${existing[0].id}`, {
              method: "PATCH",
              body: JSON.stringify(payload),
            });
            console.log(`Updated CNAME ${recordName} -> ${recordContent}`);
          } else {
            await cloudflare("", {
              method: "POST",
              body: JSON.stringify(payload),
            });
            console.log(`Created CNAME ${recordName} -> ${recordContent}`);
          }
          NODE
